<!DOCTYPE html>
<html>
    <head>
	    <title>table colspan</title>
		<!--Col span:Combines Columns-->
	</head>
	<body>
        <!--Table border creates visible borders-->
		<table border="1">
			<tr>
			<th>NAME</th>
			<th>SUBJECT</th>
			<th>MARKS</th>
			</tr>
			<tr>
			<td>ASHOK</td>       <!--nbsp creates a non-breaking space in output-->
			<td colspan="2">HTML    -&nbsp; &nbsp; &nbsp;95</td>
			</tr>
		</table>
	</body>
</html>

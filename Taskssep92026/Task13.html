<!DOCTYPE html>
<html>
<head>
    <title>Product Comparison</title>
</head>

<body>

    <table border="1">

        <caption>
            Product Comparison Table
        </caption>

        <tr>
            <th rowspan="2">Category</th>
            <th rowspan="2">Product</th>
            <th colspan="2">Price Details</th>
        </tr>

        <tr>
            <th>Original Price</th>
            <th>Discount Price</th>
        </tr>

        <tr>
            <td rowspan="2">Electronics</td>
            <td>Laptop</td>
            <td>₹60,000</td>
            <td>₹55,000</td>
        </tr>

        <tr>
            <td>Mobile</td>
            <td>₹30,000</td>
            <td>₹28,000</td>
        </tr>

        <tr>
            <td rowspan="2">Accessories</td>
            <td>Keyboard</td>
            <td>₹2,000</td>
            <td>₹1,500</td>
        </tr>

        <tr>
            <td>Mouse</td>
            <td>₹1,000</td>
            <td>₹800</td>
        </tr>

        <tr>
            <td>Home Appliances</td>
            <td>Fan</td>
            <td>₹3,000</td>
            <td>₹2,500</td>
        </tr>

    </table>

</body>
</html>
